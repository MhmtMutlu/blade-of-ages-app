<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!-- Blades of Ages brand mark: six outward-facing blades around a gem. -->
  <defs>
    <g id="blade">
      <path d="M32 2.5 L34.6 8 L34.6 21 L29.4 21 L29.4 8 Z" fill="#EEF3FF" stroke="#7FA8C9" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M32 4.5 L32 20" stroke="#BFD8EE" stroke-width="1"/>
      <rect x="27.2" y="20.6" width="9.6" height="2.8" rx="1.4" fill="#E5A526" stroke="#8A5A12" stroke-width="0.9"/>
      <rect x="30.6" y="23.2" width="2.8" height="3.6" rx="1" fill="#8A5A3A"/>
    </g>
  </defs>
  <symbol id="m" viewBox="0 0 64 64">
    <use href="#blade"/>
    <use href="#blade" transform="rotate(60 32 32)"/>
    <use href="#blade" transform="rotate(120 32 32)"/>
    <use href="#blade" transform="rotate(180 32 32)"/>
    <use href="#blade" transform="rotate(240 32 32)"/>
    <use href="#blade" transform="rotate(300 32 32)"/>
    <circle cx="32" cy="32" r="5.6" fill="#FFFFFF" stroke="#C9D7DE" stroke-width="1"/>
    <circle cx="32" cy="32" r="3.2" fill="#12A684"/>
  </symbol>
    <use href="#m"/>
</svg>
